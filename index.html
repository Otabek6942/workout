<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>30-Day Fitness Challenge</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">Fit30</div>
        <div class="nav-links">
            <a href="#" id="home-link">Home</a>
            <a href="#" id="login-link">Login</a>
            <a href="#" id="register-link">Register</a>
        </div>
    </nav>

    <div class="container">
        <!-- Login Form -->
        <div id="login-form" class="form-container">
            <h2>Login</h2>
            <form id="loginForm">
                <input type="email" id="login-email" placeholder="Email" required>
                <input type="password" id="login-password" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>
        </div>

        <!-- Registration Form -->
        <div id="register-form" class="form-container">
            <h2>Create Account</h2>
            <form id="registerForm">
                <input type="text" id="username" placeholder="Username" required>
                <input type="email" id="email" placeholder="Email" required>
                <input type="password" id="password" placeholder="Password" required>
                <input type="number" id="height" placeholder="Height (cm)" required>
                <input type="number" id="weight" placeholder="Weight (kg)" required>
                <input type="number" id="age" placeholder="Age" required>
                <select id="fitness-level" required>
                    <option value="">Select Fitness Level</option>
                    <option value="beginner">Beginner</option>
                    <option value="intermediate">Intermediate</option>
                    <option value="advanced">Advanced</option>
                </select>
                <button type="submit">Register</button>
            </form>
        </div>

        <!-- Dashboard -->
        <div id="dashboard" class="dashboard-container">
            <div class="user-info">
                <h2>Welcome, <span id="user-name"></span>!</h2>
                <div class="stats">
                    <div class="stat-item">
                        <span>Current Day:</span>
                        <span id="current-day">1</span>
                    </div>
                    <div class="stat-item">
                        <span>Progress:</span>
                        <span id="progress">0%</span>
                    </div>
                </div>
            </div>

            <div class="main-content">
                <div class="workout-container">
                    <div class="workout-header">
                        <h3>Today's Workout - Day <span id="workout-day">1</span></h3>
                        <div class="workout-meta">
                            <span class="duration"><i class="fas fa-clock"></i> <span id="workout-duration">30</span> minutes</span>
                            <span class="difficulty"><i class="fas fa-fire"></i> <span id="workout-difficulty">Beginner</span></span>
                        </div>
                    </div>
                    
                    <div id="workout-content" class="workout-exercises">
                        <!-- Workout content will be dynamically loaded here -->
                    </div>

                    <div class="workout-actions">
                        <button id="complete-workout" class="primary-btn">
                            <i class="fas fa-check"></i> Mark as Complete
                        </button>
                        <div class="workout-timer">
                            <span>Rest Timer:</span>
                            <span id="timer">00:00</span>
                            <button id="start-timer" class="secondary-btn">
                                <i class="fas fa-play"></i> Start
                            </button>
                        </div>
                    </div>
                </div>

                <div class="progress-tracker">
                    <h3>Your Progress</h3>
                    <div class="progress-bar">
                        <div class="progress-fill"></div>
                    </div>
                    <div class="calendar">
                        <!-- Calendar will be dynamically generated -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
